name: update-data
on:
  schedule:
    - cron: "30 0 * * 2-6"   # 台灣時間週二到週六 08:30(美股收盤後);GitHub 可能延遲數十分鐘
  workflow_dispatch: {}       # 允許手動按鈕執行
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python fetch_data.py
      - name: 提交更新
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || (git commit -m "update data" && git push)
