name: update-data
on:
  schedule:
    # 以下為 UTC；台灣 = UTC+8。GitHub 排程可能延遲數十分鐘。
    - cron: "7,37 1-5 * * 1-5"        # 台股盤中：台灣週一到週五 09:07 到 13:37，每 30 分鐘（最後一次在收盤後，補抓最終價）
    - cron: "7 6 * * 1-5"             # 台灣 14:07：補抓證交所收盤與外資資料；期交所資料於 16:07 更新
    - cron: "7 8,10 * * 1-5"          # 台灣 16:07、18:07：更新官方收盤與期交所日夜盤資料
    - cron: "7 23 * * 0-5"             # 台灣 07:07（期交所夜盤收盤資料約 07:00 產製；第一次補抓）
    - cron: "7 0 * * 1-6"              # 台灣 08:07（若 07:07 延遲或失敗，再重試夜盤資料）
    - cron: "7 14,16,18,20,22 * * 1-5" # 美股交易時段每 2 小時（台灣 22:07、00:07、02:07、04:07、06:07）；最後一次為收盤後最終更新，夏令冬令都涵蓋
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝依賴
        run: pip install yfinance pandas requests
      - name: 更新市場資料
        run: python fetch_data.py
      - name: 驗證資料檔
        run: |
          python - <<'PY'
          import json
          with open("docs/data.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("update_status") != "failed", "所有行情標的更新失敗，停止提交"
          assert isinstance(data.get("items"), list) and data["items"], "行情清單為空"
          assert "foreign_meta" in data, "缺少外資資料狀態"
          analysis = data.get("market_analysis") or {}
          assert analysis.get("risk_score") is not None, "主要指數有效資料不足，停止提交，避免發布沒有有效分析的資料"
          assert analysis.get("coverage", 0) >= 2, "至少需要 2 個主要指數成功更新，否則停止提交"
          print(f"資料驗證完成：行情 {data.get('successful_items')}/{data.get('total_items')} 個標的成功；市場分析涵蓋 {analysis.get('coverage')}/{analysis.get('coverage_total')} 個指數")
          PY
      - name: 提交更新
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git add docs/fut_probe.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "update data" && git push)
