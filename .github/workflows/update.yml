name: update-data
on:
  schedule:
    # 以下為 UTC；台灣 = UTC+8。GitHub 排程可能延遲數十分鐘。
    - cron: "30 1-5 * * 1-5"          # 台股盤中：台灣週一到週五 09:30、10:30、11:30、12:30、13:30
    - cron: "0 8,10 * * 1-5"          # 台股收盤後：台灣 16:00、18:00（證交所、期交所資料；當天已有就跳過第二次）
    - cron: "0 14,16,18,20,22 * * 1-5" # 美股交易時段每 2 小時；22:00 UTC（台灣隔天 06:00）為收盤後最終更新，夏令冬令都涵蓋
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝依賴
        run: pip install yfinance pandas requests
      - name: 更新市場資料
        run: python fetch_data.py
      - name: 驗證資料檔
        run: |
          python - <<'PY'
          import json
          with open("docs/data.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("update_status") != "failed", "所有行情標的更新失敗，停止提交"
          assert isinstance(data.get("items"), list) and data["items"], "行情清單為空"
          assert "foreign_meta" in data, "缺少外資資料狀態"
          print(f"資料驗證完成：{data.get('successful_items')}/{data.get('total_items')} 個標的成功")
          PY
      - name: 提交更新
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || (git commit -m "update data" && git push)
