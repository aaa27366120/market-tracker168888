name: Market Tracker tests

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝測試依賴
        run: python -m pip install pandas requests
      - name: Python 語法檢查
        run: python -m py_compile fetch_data.py stock_data.py
      - name: 執行單元測試
        run: python -m unittest discover -s tests -v
      - name: TWSE MIS 加權指數非阻擋式 smoke test
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests

          url = "https://mis.twse.com.tw/stock/api/getStockInfo.jsp"
          headers = {
              "User-Agent": "Mozilla/5.0 market-tracker/1.0",
              "Referer": "https://mis.twse.com.tw/stock/index.jsp",
              "Accept": "application/json, text/plain, */*",
          }
          try:
              with requests.Session() as session:
                  landing = session.get(
                      "https://mis.twse.com.tw/stock/index.jsp",
                      headers=headers, timeout=20
                  )
                  landing.raise_for_status()
                  response = session.get(
                      url,
                      params={"ex_ch": "tse_t00.tw", "json": "1", "delay": "0"},
                      headers=headers, timeout=20
                  )
                  print(f"TWSE MIS HTTP status: {response.status_code}")
                  response.raise_for_status()
                  payload = response.json()
                  rows = payload.get("msgArray") or []
                  print(f"TWSE MIS msgArray empty: {not bool(rows)}")
                  row = next(
                      (item for item in rows if str(item.get("c", "")).lower() in ("t00", "tse_t00")),
                      rows[0] if rows else None
                  )
                  if row:
                      print(
                          "TWSE MIS t00: "
                          f"d={row.get('d')}; t={row.get('t')}; "
                          f"z={row.get('z')}; y={row.get('y')}"
                      )
                  else:
                      print("::warning::TWSE MIS smoke test returned an empty msgArray")
          except Exception as exc:
              print(f"::warning::TWSE MIS smoke test unavailable/failed: {type(exc).__name__}: {exc}")
          PY

      - name: 官方 API 非阻擋式 smoke test
        continue-on-error: true
        run: |
          python - <<'PY'
          import stock_data

          for market, source in stock_data.SOURCES.items():
              try:
                  master = stock_data.fetch_json(source["master_url"])
                  quotes = stock_data.fetch_json(source["quotes_url"])
                  trading_date, items, stats = stock_data.parse_market(
                      market, master, quotes, return_stats=True
                  )
                  print(
                      f"{market}: master_rows={len(master)}; quote_rows={len(quotes)}; "
                      f"parsed_rows={len(items)}; trading_date={trading_date}; "
                      f"stats={stats}; quote_columns={list(quotes[0]) if quotes else []}"
                  )
              except Exception as exc:
                  print(f"::warning::{market} live parser smoke test unavailable/failed: {type(exc).__name__}: {exc}")
          PY
