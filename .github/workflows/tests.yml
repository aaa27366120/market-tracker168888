name: Market Tracker tests

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝測試依賴
        run: python -m pip install pandas requests
      - name: Python 語法檢查
        run: python -m py_compile fetch_data.py
      - name: 執行單元測試
        run: python -m unittest discover -s tests -v
