name: validate-phase3
on:
  pull_request:
    branches: [main]
    paths:
      - "fetch_data.py"
      - "docs/index.html"
      - "README.md"
      - ".github/workflows/validate-phase3.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile fetch_data.py
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("docs/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          assert scripts, "No inline dashboard script found"
          Path("/tmp/dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/dashboard.js
